name: Bufferbox
description: BufferBox was a Waterloo, Ontario startup that operated self-service parcel-pickup
  lockers for online shoppers, letting people route e-commerce deliveries to a nearby locker
  and collect them with a PIN. Google acquired BufferBox in November 2012 and wound the service
  down in early 2015. The company is defunct and operates no developer or API surface; the
  bufferbox.com and bufferbox.ca domains are parked (resolving to a Bizland placeholder host),
  so this profile carries no API artifacts. Retained in the API Evangelist network as a
  historical logistics / last-mile-delivery record.
